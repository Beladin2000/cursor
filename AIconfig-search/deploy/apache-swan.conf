# Apache in front of the React build and the V27 FastAPI process.
# Document root is the published React build plus public/data indexes.
# Node 20 builds the React app. Python 3.11 builds the indexes and runs Uvicorn.

<VirtualHost *:80>
    ServerName swan.example
    DocumentRoot /var/www/html/AI-config-search

    <Directory /var/www/html/AI-config-search>
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:4183/api
    ProxyPassReverse /api http://127.0.0.1:4183/api
</VirtualHost>
